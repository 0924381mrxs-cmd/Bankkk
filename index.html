<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Bankak Demo</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    background:#fff;
    font-family:Tahoma,Arial,sans-serif;
    color:#111;
}

button,input{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

.screen{
    display:none;
    width:100%;
    background:#fff;
}

.screen.active{
    display:block;
}

/* =====================================================
   SVG عام
===================================================== */

svg{
    display:block;
}


/* =====================================================
   الشعار
===================================================== */

.bankak-logo{
    width:180px;
    height:auto;
    margin:auto;
}


/* =====================================================
   LOGIN
===================================================== */

.login{
    min-height:100vh;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #ff0808 0px,
            #ff0808 190px,
            #e81725 360px,
            #c31c30 470px,
            #ffffff 470px,
            #ffffff 100%
        );
}


/* اللغة */

.lang{
    position:absolute;
    top:13px;
    right:18px;

    width:42px;
    height:42px;

    border:3px solid #fff;
    border-radius:6px;

    background:transparent;
    color:#fff;

    z-index:10;
}

.lang-a{
    position:absolute;
    left:4px;
    top:3px;
    font-size:20px;
}

.lang-ar{
    position:absolute;
    right:-5px;
    bottom:-5px;

    width:27px;
    height:27px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#fff;
    color:#d51b2c;

    border-radius:6px;

    font-size:17px;
}


/* الشعار */

.login-logo{
    position:absolute;

    top:76px;
    left:0;
    right:0;

    text-align:center;
}

.login-logo svg{
    width:220px;
    height:auto;
    margin:auto;
}


/* الحقول */

.login-form{
    position:absolute;

    top:248px;

    left:21px;
    right:21px;
}


/* input */

.input-box{
    width:100%;
    height:72px;

    margin-bottom:23px;

    background:#fff;

    border:1.5px solid #aaa;

    border-radius:15px;

    box-shadow:
        0 1px 3px rgba(0,0,0,.25);

    display:flex;
    align-items:center;

    padding:0 12px;
}

.input-icon{
    width:48px;
    min-width:48px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.input-icon svg{
    width:39px;
    height:39px;
}

.input-box input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    font-size:18px;

    color:#555;

    text-align:right;
}

.input-box input::placeholder{
    color:#999;
}


/* زر الدخول */

.login-btn{
    display:block;

    width:95%;
    height:67px;

    margin:69px auto 0;

    border-radius:15px;

    border:3px solid #b40d18;

    background:
        linear-gradient(
            to bottom,
            #f7b0b0 0%,
            #ed5c61 35%,
            #ef1019 55%,
            #f00810 100%
        );

    box-shadow:
        0 4px 6px rgba(0,0,0,.35),
        inset 0 2px 2px rgba(255,255,255,.8);

    color:#fff;

    font-size:27px;
    font-weight:bold;
}


/* الروابط */

.login-links{
    width:100%;

    margin-top:44px;

    display:flex;

    justify-content:space-between;

    color:#aaa;

    font-size:18px;
}

.share-code{
    margin-top:38px;

    display:flex;
    align-items:center;

    gap:10px;

    color:#aaa;

    font-size:18px;
}

.qr{
    width:43px;
    height:43px;
}


/* أسفل الدخول */

.login-footer{
    position:absolute;

    left:0;
    right:0;

    bottom:15px;

    display:flex;

    justify-content:center;

    gap:52px;
}

.footer-item{
    text-align:center;

    color:#aaa;

    font-size:14px;
}

.footer-circle{
    width:48px;
    height:48px;

    margin:auto auto 7px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 3px 5px rgba(0,0,0,.3);
}

.footer-circle svg{
    width:27px;
    height:27px;
}

.footer-location{
    background:#df2929;
}

.footer-help{
    background:#a9dc2b;
}

.footer-facebook{
    background:#365c95;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:127px;

    position:relative;

    background:
        linear-gradient(
            to bottom,
            #ff0808,
            #d91629
        );

    display:flex;
    justify-content:center;
    align-items:center;
}

.header-logo{
    width:105px;
}

.header-button{
    position:absolute;

    background:transparent;

    color:#fff;
}

.info-button{
    left:23px;
    top:42px;

    width:38px;
    height:38px;

    border-radius:50%;

    background:#fff;
    color:#d51b2b;

    font-family:Georgia,serif;
    font-size:27px;
    font-style:italic;
    font-weight:bold;
}

.menu-button{
    right:23px;
    top:43px;

    width:38px;
}

.menu-button span{
    display:block;

    height:4px;

    margin:6px 0;

    border-radius:5px;

    background:#fff;
}


/* الصفحة الرئيسية القديمة لها زر طاقة وجرس */

.power-button{
    position:absolute;

    left:22px;
    top:41px;

    color:#fff;

    font-size:39px;
}

.bell-button{
    position:absolute;

    right:22px;
    top:43px;

    color:#fff;
}


/* =====================================================
   HOME
===================================================== */

.home{
    background:#f8f8f8;
}

.greeting{
    height:63px;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    padding:0 20px;

    background:#fff;

    font-size:19px;

    border-bottom:1px solid #eee;
}

.greeting strong{
    direction:ltr;
    margin-right:5px;
}


/* شبكة الخدمات */

.services{
    width:100%;

    padding:29px 27px 60px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    column-gap:24px;
    row-gap:42px;
}


/* الخدمة */

.service{
    background:transparent;

    text-align:center;

    color:#111;

    padding:0;

    font-size:17px;
}

.service-icon{
    width:63px;
    height:63px;

    margin:auto;

    border-radius:9px;

    border:2px solid #a30e18;

    background:
        linear-gradient(
            to bottom,
            #efa3a3 0%,
            #e4575d 48%,
            #e71922 49%,
            #ee1019 100%
        );

    box-shadow:
        0 4px 6px rgba(0,0,0,.45);

    display:flex;
    align-items:center;
    justify-content:center;
}

.service-icon svg{
    width:39px;
    height:39px;
}

.service-title{
    margin-top:13px;

    line-height:1.2;
}


/* =====================================================
   INNER PAGE TITLE
===================================================== */

.page-title{
    position:relative;

    height:91px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#fff;

    font-size:25px;
}

.back-btn{
    position:absolute;

    right:17px;
    top:15px;

    width:70px;
    height:42px;

    border:2px solid #a00d18;

    border-radius:10px;

    background:#fff;

    color:#c7182b;

    font-size:18px;

    box-shadow:0 3px 5px rgba(0,0,0,.3);
}


/* =====================================================
   BILLS
===================================================== */

.bill-tabs{
    height:72px;

    display:grid;

    grid-template-columns:1fr 1fr;
}

.bill-tab{
    background:#d51c2b;

    color:#fff;

    font-size:25px;

    font-weight:bold;
}

.bill-tab.active{
    background:
        linear-gradient(
            to bottom,
            #ff0808,
            #d51c2b
        );
}

.bill-grid{
    padding:25px 17px 60px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:27px 50px;
}

.bill-card{
    height:110px;

    position:relative;

    border-radius:25px;

    border:2.5px solid #9d0c15;

    background:
        linear-gradient(
            to bottom,
            #efb2b2 0%,
            #df777b 49%,
            #e71c26 50%,
            #e91b25 100%
        );

    box-shadow:
        0 5px 7px rgba(0,0,0,.45);

    overflow:hidden;

    color:#fff;
}

.bill-name{
    position:absolute;

    top:9px;
    right:9px;
    left:6px;

    font-size:17px;

    text-align:right;

    white-space:nowrap;
}

.bill-icon-circle{
    position:absolute;

    left:20px;
    bottom:16px;

    width:38px;
    height:38px;

    border-radius:50%;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;
}

.bill-icon-circle svg{
    width:23px;
    height:23px;
}


/* =====================================================
   ACCOUNT
===================================================== */

.accounts{
    padding:9px 14px 80px;
}

.account-card{
    margin-bottom:43px;

    background:#fff;

    border:1px solid #ddd;

    box-shadow:
        0 3px 6px rgba(0,0,0,.23);
}

.account-main{
    height:92px;

    display:flex;

    align-items:center;

    border-bottom:1px solid #bbb;

    padding:8px;
}

.account-symbol{
    width:47px;
    min-width:47px;
}

.account-symbol svg{
    width:42px;
    height:42px;
}

.account-data{
    flex:1;

    text-align:right;

    padding-right:8px;
}

.account-name{
    color:#a52635;

    font-size:19px;

    margin-bottom:9px;
}

.account-number{
    color:#8e3842;

    font-size:13px;

    line-height:1.5;
}

.account-balance{
    color:#159441;

    font-size:22px;

    direction:ltr;

    min-width:48px;
}


.account-actions{
    height:52px;

    display:grid;

    grid-template-columns:1fr 1fr;
}

.account-action{
    background:#fff;

    font-size:15px;

    font-weight:bold;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    border-left:1px solid #bbb;
}

.account-action:last-child{
    border-left:0;
}

.account-action svg{
    width:31px;
    height:31px;
}


/* =====================================================
   TRANSFERS
===================================================== */

.transfer-list{
    padding:25px 15px;
}

.transfer-card{
    height:82px;

    margin-bottom:25px;

    background:#fff;

    border:1px solid #ddd;

    box-shadow:0 3px 6px rgba(0,0,0,.25);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 17px;

    font-size:19px;
}

.transfer-card svg{
    width:42px;
    height:42px;
}

.transfer-arrow{
    color:#c7192b;

    font-size:34px;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:999;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.5);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:84%;

    background:#fff;

    border-radius:17px;

    padding:25px;

    text-align:center;

    box-shadow:0 8px 25px #333;
}

.modal-box h3{
    color:#c7182b;
}

.modal-box p{
    font-size:17px;

    line-height:1.7;
}

.modal-box button{
    width:100%;

    height:45px;

    border-radius:9px;

    background:#d51c2b;

    color:#fff;

    font-size:18px;
}


/* =====================================================
   شاشات صغيرة جدًا
===================================================== */

@media(max-width:360px){

    .services{
        column-gap:13px;
        padding-left:15px;
        padding-right:15px;
    }

    .service{
        font-size:14px;
    }

    .service-icon{
        width:57px;
        height:57px;
    }

    .service-icon svg{
        width:35px;
        height:35px;
    }

    .bill-grid{
        gap:22px 18px;
        padding-left:12px;
        padding-right:12px;
    }

    .bill-name{
        font-size:14px;
    }
}

</style>
</head>

<script>

/* =====================================================
   تسجيل الدخول
===================================================== */

function login(){

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value
        .trim();


    if(username === "" && password === ""){

        showMessage(
            "يرجى إدخال رقم الحساب وكلمة المرور."
        );

        return;
    }


    if(username === ""){

        showMessage(
            "يرجى إدخال رقم الحساب."
        );

        return;
    }


    if(password === ""){

        showMessage(
            "يرجى إدخال كلمة المرور."
        );

        return;
    }


    openPage("homeScreen");
}


/* =====================================================
   فتح الصفحات
===================================================== */

function openPage(id){

    document
        .querySelectorAll(".screen")
        .forEach(function(screen){

            screen.classList.remove("active");

        });


    const page =
        document.getElementById(id);


    if(page){

        page.classList.add("active");

        window.scrollTo(0,0);

    }
}


/* =====================================================
   العودة
===================================================== */

function goHome(){

    openPage("homeScreen");

}


/* =====================================================
   رسالة
===================================================== */

function showMessage(message){

    document.getElementById("modalText")
        .textContent = message;

    document.getElementById("modal")
        .classList.add("show");
}


/* =====================================================
  تصميم ود النهري
===================================================== */

function demo(){

    document.getElementById("modalText")
        .textContent =
        "هذه الخاصية موجودة في التصميم التجريبي فقط.";

    document.getElementById("modal")
        .classList.add("show");
}


/* =====================================================
   إغلاق
===================================================== */

function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

}


/* إغلاق عند الضغط خارج النافذة */

document
    .getElementById("modal")
    .addEventListener("click",function(e){

        if(e.target === this){

            closeModal();

        }

    });


/* Enter */

document
    .getElementById("password")
    .addEventListener("keydown",function(e){

        if(e.key === "Enter"){

            login();

        }

    });

</script>
